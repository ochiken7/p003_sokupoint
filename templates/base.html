<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}即ポイントクラブ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E63946',
                        accent1: '#EF476F',
                        accent2: '#FFB4BA',
                        'off-white': '#FFF5F5',
                        border_pink: '#FCE4E8',
                        success: '#10B981',
                        warning: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="font-['Noto_Sans_JP',_'Inter',_sans-serif] bg-white text-gray-800 pb-20 md:pb-0">
    {% include '_partials/header.html' %}

    <!-- フラッシュメッセージ -->
    {% include '_partials/flash.html' %}

    <!-- メインコンテンツ -->
    <main class="max-w-5xl mx-auto px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- SPタブバー -->
    {% include '_partials/tab_bar.html' %}

    <script>lucide.createIcons();</script>
    {% block scripts %}{% endblock %}
</body>
</html>
