{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="max-w-5xl mx-auto px-4 pt-3">
        {% for category, message in messages %}
        <div class="rounded-lg px-4 py-3 mb-2 text-sm flex items-center gap-2
            {% if category == 'success' %}bg-green-50 text-green-700 border border-green-200
            {% elif category == 'error' %}bg-red-50 text-red-700 border border-red-200
            {% elif category == 'warning' %}bg-yellow-50 text-yellow-700 border border-yellow-200
            {% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
            {% if category == 'success' %}<i data-lucide="check-circle" class="w-4 h-4 flex-shrink-0"></i>
            {% elif category == 'error' %}<i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
            {% elif category == 'warning' %}<i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0"></i>
            {% else %}<i data-lucide="info" class="w-4 h-4 flex-shrink-0"></i>{% endif %}
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
{% endwith %}
