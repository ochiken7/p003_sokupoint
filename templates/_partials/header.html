<header class="bg-white border-b border-border_pink sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
        <a href="{{ url_for('home.index') }}" class="flex items-center gap-2">
            {% set logo = get_asset('logo_header') %}
            {% if logo and logo.file_path %}
                <img src="{{ url_for('static', filename=logo.file_path) }}" alt="{{ logo.alt_text }}" class="h-8">
            {% else %}
                <span class="text-primary font-bold text-lg">即ポイントクラブ</span>
            {% endif %}
        </a>

        {% if current_user %}
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-600">
            <a href="{{ url_for('home.index') }}" class="hover:text-primary transition-colors {% if request.endpoint == 'home.index' %}text-primary{% endif %}">ホーム</a>
            <a href="{{ url_for('game.index') }}" class="hover:text-primary transition-colors {% if request.endpoint and request.endpoint.startswith('game.') %}text-primary{% endif %}">ゲーム</a>
            <a href="{{ url_for('coupon.index') }}" class="hover:text-primary transition-colors {% if request.endpoint and request.endpoint.startswith('coupon.') %}text-primary{% endif %}">クーポン</a>
            <a href="{{ url_for('checkin.index') }}" class="hover:text-primary transition-colors {% if request.endpoint and request.endpoint.startswith('checkin.') %}text-primary{% endif %}">チェックイン</a>
            <a href="{{ url_for('me.index') }}" class="hover:text-primary transition-colors {% if request.endpoint == 'me.index' %}text-primary{% endif %}">マイページ</a>
        </nav>

        <div class="flex items-center gap-3">
            <span class="rank-badge text-xs" style="background-color: {{ current_user.rank.color }};">
                {{ current_user.rank.name }}
            </span>
            <div class="flex items-center gap-1 text-sm">
                <i data-lucide="coins" class="w-4 h-4 text-primary"></i>
                <span class="font-bold text-primary">{{ '{:,}'.format(current_user.total_points) }}P</span>
            </div>
            <a href="{{ url_for('auth.demo_switch') }}" class="hidden md:flex items-center gap-1 text-xs text-gray-500 hover:text-primary transition-colors">
                <i data-lucide="repeat" class="w-3.5 h-3.5"></i>切替
            </a>
        </div>
        {% endif %}
    </div>
</header>
