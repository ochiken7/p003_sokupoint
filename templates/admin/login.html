<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ログイン - 即ポイントクラブ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-['Noto_Sans_JP'] bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm px-6">
        <div class="text-center mb-6">
            <i data-lucide="shield" class="w-12 h-12 text-gray-400 mx-auto mb-2"></i>
            <h1 class="text-xl font-bold text-gray-800">管理画面ログイン</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="rounded-lg px-4 py-2 mb-4 text-sm bg-red-50 text-red-700 border border-red-200">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">ユーザー名</label>
                <input type="text" name="username" required autocomplete="username"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
                <input type="password" name="password" required autocomplete="current-password"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
            </div>
            <button type="submit" class="w-full py-2 rounded-lg bg-gray-800 text-white font-bold text-sm hover:bg-gray-700 transition-colors">
                ログイン
            </button>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
