{% extends 'admin/base.html' %}
{% block title %}{{ 'クーポン編集' if coupon else 'クーポン新規作成' }}{% endblock %}

{% block content %}
<h1 class="text-xl font-bold text-gray-800 mb-4">{{ 'クーポン編集' if coupon else 'クーポン新規作成' }}</h1>

<form method="POST" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4 max-w-2xl">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">タイトル</label>
        <input type="text" name="title" value="{{ coupon.title if coupon else '' }}" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">説明</label>
        <textarea name="description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">{{ coupon.description if coupon else '' }}</textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">参加可能ランク</label>
            <select name="required_rank" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
                {% for val in ['BRONZE','SILVER','GOLD','VIP'] %}
                <option value="{{ val }}" {{ 'selected' if coupon and coupon.required_rank == val }}>{{ val }}以上</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">当選枠(名)</label>
            <input type="number" name="winner_count" min="1" value="{{ coupon.winner_count if coupon else 1 }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">応募開始</label>
            <input type="datetime-local" name="entry_start"
                   value="{{ coupon.entry_start.strftime('%Y-%m-%dT%H:%M') if coupon and coupon.entry_start else '' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">応募終了</label>
            <input type="datetime-local" name="entry_end"
                   value="{{ coupon.entry_end.strftime('%Y-%m-%dT%H:%M') if coupon and coupon.entry_end else '' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
    </div>

    <div class="flex items-center gap-2">
        <input type="checkbox" name="is_active" id="is_active" {{ 'checked' if not coupon or coupon.is_active }}
               class="w-4 h-4 text-primary rounded">
        <label for="is_active" class="text-sm text-gray-700">有効にする</label>
    </div>

    <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg text-sm font-bold hover:opacity-90">保存</button>
        <a href="{{ url_for('admin.coupons_list') }}" class="px-6 py-2 rounded-lg text-sm text-gray-600 border border-gray-300 hover:bg-gray-50">キャンセル</a>
    </div>
</form>
{% endblock %}
