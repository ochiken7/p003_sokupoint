{% extends 'admin/base.html' %}
{% block title %}店舗管理{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-bold text-gray-800">店舗管理</h1>
    <a href="{{ url_for('admin.stores_create') }}" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold hover:opacity-90 flex items-center gap-1">
        <i data-lucide="plus" class="w-4 h-4"></i>新規作成
    </a>
</div>

<div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600">
            <tr>
                <th class="px-4 py-3 text-left">店舗名</th>
                <th class="px-4 py-3 text-left">エリア</th>
                <th class="px-4 py-3 text-center hidden md:table-cell">QRトークン</th>
                <th class="px-4 py-3 text-center">状態</th>
                <th class="px-4 py-3 text-right">操作</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            {% for store in stores %}
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium text-gray-800">{{ store.name }}</td>
                <td class="px-4 py-3 text-gray-600">{{ store.area }}</td>
                <td class="px-4 py-3 text-center hidden md:table-cell text-xs font-mono text-gray-400">{{ store.qr_token }}</td>
                <td class="px-4 py-3 text-center">
                    <span class="px-2 py-0.5 rounded text-xs font-bold {{ 'bg-green-100 text-green-700' if store.is_active else 'bg-gray-100 text-gray-500' }}">
                        {{ '有効' if store.is_active else '無効' }}
                    </span>
                </td>
                <td class="px-4 py-3 text-right space-x-1">
                    <a href="{{ url_for('admin.stores_edit', store_id=store.id) }}" class="text-gray-500 hover:text-primary text-xs">編集</a>
                    <form method="POST" action="{{ url_for('admin.stores_delete', store_id=store.id) }}" class="inline" onsubmit="return confirm('削除しますか?')">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button class="text-red-400 hover:text-red-600 text-xs">削除</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
