{% extends 'admin/base.html' %}
{% block title %}{{ 'ゲーム編集' if game else 'ゲーム新規作成' }}{% endblock %}

{% block content %}
<h1 class="text-xl font-bold text-gray-800 mb-4">{{ 'ゲーム編集' if game else 'ゲーム新規作成' }}</h1>

<form method="POST" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4 max-w-2xl">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ゲーム名</label>
        <input type="text" name="name" value="{{ game.name if game else '' }}" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">タイプ</label>
        <select name="game_type" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
            {% for val, label in [('scratch','スクラッチ'), ('roulette','ルーレット'), ('quiz','クイズ')] %}
            <option value="{{ val }}" {{ 'selected' if game and game.game_type == val }}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">説明</label>
        <textarea name="description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">{{ game.description if game else '' }}</textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">当選率 (0.0-1.0)</label>
            <input type="number" name="win_rate" step="0.01" min="0" max="1" value="{{ game.win_rate if game else 0.3 }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">表示順</label>
            <input type="number" name="priority" value="{{ game.priority if game else 0 }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
    </div>

    <div class="grid grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">当選最小P</label>
            <input type="number" name="points_on_win_min" value="{{ game.points_on_win_min if game else 10 }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">当選最大P</label>
            <input type="number" name="points_on_win_max" value="{{ game.points_on_win_max if game else 100 }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">外れP</label>
            <input type="number" name="points_on_lose" value="{{ game.points_on_lose if game else 1 }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">追加設定 (JSON)</label>
        <textarea name="config_json" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary/30">{{ game.config_json if game and game.config_json else '' }}</textarea>
    </div>

    <div class="flex items-center gap-2">
        <input type="checkbox" name="is_active" id="is_active" {{ 'checked' if not game or game.is_active }}
               class="w-4 h-4 text-primary rounded">
        <label for="is_active" class="text-sm text-gray-700">有効にする</label>
    </div>

    <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg text-sm font-bold hover:opacity-90">保存</button>
        <a href="{{ url_for('admin.games_list') }}" class="px-6 py-2 rounded-lg text-sm text-gray-600 border border-gray-300 hover:bg-gray-50">キャンセル</a>
    </div>
</form>
{% endblock %}
