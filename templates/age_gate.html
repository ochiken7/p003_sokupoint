<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年齢確認 - 即ポイントクラブ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#E63946', accent1: '#EF476F' } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-['Noto_Sans_JP'] bg-white min-h-screen flex items-center justify-center">
    <div class="text-center px-6 max-w-sm">
        <div class="mb-6">
            <i data-lucide="shield-check" class="w-16 h-16 text-primary mx-auto"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">年齢確認</h1>
        <p class="text-gray-500 text-sm mb-8">このサイトは18歳以上の方を対象としています。</p>
        <form method="POST" action="{{ url_for('auth.age_gate_confirm') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit"
                class="w-full py-3 rounded-lg font-bold text-white text-base"
                style="background: linear-gradient(135deg, #E63946, #EF476F);">
                18歳以上です
            </button>
        </form>
        <p class="text-xs text-gray-400 mt-4">18歳未満の方はご利用いただけません。</p>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
