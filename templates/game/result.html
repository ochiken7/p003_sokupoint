{% extends 'base.html' %}
{% block title %}結果 - {{ game.name }} - 即ポイントクラブ{% endblock %}

{% block content %}
<div class="text-center py-8">
    {% if points > 10 %}
    <div class="mb-4">
        <i data-lucide="party-popper" class="w-20 h-20 text-primary mx-auto"></i>
    </div>
    {% elif points > 0 %}
    <div class="mb-4">
        <i data-lucide="smile" class="w-20 h-20 text-accent1 mx-auto"></i>
    </div>
    {% else %}
    <div class="mb-4">
        <i data-lucide="meh" class="w-20 h-20 text-gray-400 mx-auto"></i>
    </div>
    {% endif %}

    <h1 class="text-2xl font-bold text-gray-800 mb-2">{{ label }}</h1>

    <div class="card inline-block px-8 py-4 mb-6">
        <p class="text-sm text-gray-500">獲得ポイント</p>
        <p class="text-3xl font-bold text-primary">+{{ points }}P</p>
    </div>

    <div class="space-y-3">
        <a href="{{ url_for('game.index') }}"
           class="block btn-primary mx-auto" style="max-width: 280px;">
            ゲーム一覧に戻る
        </a>
        <a href="{{ url_for('home.index') }}"
           class="block text-sm text-gray-500 hover:text-primary transition-colors">
            ホームに戻る
        </a>
    </div>
</div>
{% endblock %}
